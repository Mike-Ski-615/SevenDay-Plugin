# 仓库根 —— cargo workspace，供多个插件共享依赖与构建产物。
#
# 新增插件只需：
#   1. 建目录（如 `Plugin2/`，内含 `Cargo.toml` 与 `src/`）
#   2. 把目录名加进下面的 `members`

[workspace]
members = ["SevenDays"]
# vendor/ 是通过 path 引用的依赖，不是 workspace 成员，显式排除。
exclude = ["vendor"]
resolver = "3"

# wasm cdylib 插件开 LTO 可以显著减小体积。
# 注意：profile 只能在 workspace 根定义，成员 Cargo.toml 里的同名配置会被忽略。
[profile.release]
lto = true
